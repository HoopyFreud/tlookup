name: Build Android

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build APK
    environment: Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/setup@v2
        with:
          version: "^11.0.0"

      - name: Setup java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '26'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20.x

      - name: Install app dependencies
        run: pnpm install

      - name: Build project app
        run: pnpm run build

      - name: Capacitor sync
        run: pnpm exec cap sync

      - name: Build app bundle
        run: cd android && ./gradlew assembleRelease

      - name: Extract Android signing key from env
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" > android/release.jks.base64
          base64 -d android/release.jks.base64 > android/release.decrypted.jks

      - name: Align build
        run: zipalign -v -p 4 ./android/app/build/outputs/apk/app-release.apk ./android/app/build/outputs/apk/app-release-aligned.apk

      - name: Sign build
        run: apksigner sign --ks android/release.decrypted.jks --ks-pass ${{ secrets.KEYSTORE_PASSWORD }} --key-pass ${{ secrets.KEY_PASSWORD }} --out ./android/app/build/outputs/apk/app-release-signed.apk ./android/app/build/outputs/apk/app-release-aligned.apk
        
      - name: release
        uses: actions/create-release@v1
        env: ${{ secrets.GITHUB_TOKEN }}
        id: create_release
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          draft: false
          prerelease: false
          
      - name: Upload Release Asset
        id: upload-release-asset 
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }} # This pulls from the CREATE RELEASE step above, referencing it's ID to get its outputs object, which include a `upload_url`. See this blog post for more info: https://jasonet.co/posts/new-features-of-github-actions/#passing-data-to-future-steps 
          asset_path: android/app/build/outputs/bundle/release/app-release-signed.apk
          asset_name: tlookup.apk
          asset_content_type: application/apk
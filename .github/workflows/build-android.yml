name: Build Android

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build APK
    environment: Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Setup java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '26'

      - name: Setup pnpm
        uses: pnpm/setup@v2
        with:
          version: "^11.20.0"
          install: false

      - name: Install app dependencies
        run: pnpm ci

      - name: Build project app
        run: pnpm run build

      - name: Add android folder if not present
        run: if [ ! -d "./android" ]; then pnpm exec cap add android; fi

      - name: Capacitor sync
        run: pnpm exec cap sync

      - name: Generate icons and splash screen to android folder 
        run:  if [ -d "./resources" ]; then pnpm exec capacitor-assets generate --android; fi

      - name: Build app bundle
        run: cd android && ./gradlew --no-daemon assembleRelease

      - name: Align and Sign Build
        uses: kevin-david/zipalign-sign-android-release@v2
        # ID used to access action output
        id: sign_app
        with:
          releaseDirectory: ./android/app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
          zipAlign: true
        env:
          BUILD_TOOLS_VERSION: "34.0.0"
        
      - name: release
        uses: actions/create-release@v1
        env: ${{ secrets.GITHUB_TOKEN }}
        id: create_release
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          draft: false
          prerelease: false
          
      - name: Upload Release Asset
        id: upload-release-asset 
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }} # This pulls from the CREATE RELEASE step above, referencing it's ID to get its outputs object, which include a `upload_url`. See this blog post for more info: https://jasonet.co/posts/new-features-of-github-actions/#passing-data-to-future-steps 
          asset_path: ${{ steps.sign_app.outputs.signedReleaseFile }}
          asset_name: tlookup.apk
          asset_content_type: application/apk